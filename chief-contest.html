<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダイアナゴールデンプロポーションアワード 応募状況確認</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hiragino Kaku Gothic ProN', 'Helvetica Neue', Arial, sans-serif; background: #f7f3f6; color: #333; min-height: 100vh; }

    /* ============ ローディング ============ */
    #loadingScreen { position: fixed; inset: 0; background: #f7f3f6; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; z-index: 9999; }
    .spinner { width: 34px; height: 34px; border: 3px solid #e8d6e3; border-top-color: #7B4F6E; border-radius: 50%; animation: spin .8s linear infinite; }
    .spinner-sm { width: 20px; height: 20px; border-width: 2px; display: inline-block; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #7B4F6E; font-size: 14px; font-weight: bold; }

    /* ============ ログイン ============ */
    #loginScreen { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 24px 16px; }
    #loginScreen.show { display: flex; }
    .login-box { background: #fff; border-radius: 18px; width: 100%; max-width: 440px; box-shadow: 0 10px 40px rgba(123,79,110,0.16); overflow: hidden; }
    .login-head { background: linear-gradient(135deg, #7B4F6E 0%, #9d6a8c 100%); color: #fff; padding: 36px 32px 30px; text-align: center; }
    .login-mark { font-size: 40px; margin-bottom: 10px; }
    .login-brand { font-size: 13px; letter-spacing: .22em; opacity: .85; margin-bottom: 8px; }
    .login-title { font-size: 19px; font-weight: bold; line-height: 1.5; }
    .login-sub { font-size: 12px; opacity: .8; margin-top: 10px; }
    .login-body { padding: 30px 32px 26px; }
    .btn-chief { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      padding: 17px 20px; border: none; border-radius: 10px; background: #7B4F6E; color: #fff;
      font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit; }
    .btn-chief:hover { background: #6a4260; }
    .btn-chief:disabled { opacity: .45; cursor: not-allowed; }
    .hint-box { background: #faf6f9; border: 1px solid #ecdfe8; border-radius: 10px; padding: 14px 16px;
      margin-top: 16px; font-size: 13px; color: #6a5563; line-height: 1.9; }
    .hint-box .k { display: inline-block; width: 84px; color: #9b8592; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 26px 0 14px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #eee; }
    .divider span { font-size: 11px; color: #bbb; }
    .staff-toggle { display: block; width: 100%; background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 12px; color: #999; text-align: center; padding: 6px; }
    .staff-toggle:hover { color: #7B4F6E; text-decoration: underline; }
    #staffArea { display: none; margin-top: 12px; }
    #staffArea.show { display: block; }
    .btn-staff { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      padding: 13px 18px; border: 1.5px solid #ccd6e0; border-radius: 9px; background: #fff; color: #3a4a5a;
      font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; }
    .btn-staff:hover { background: #f6f9fc; border-color: #0078d4; }
    .staff-note { font-size: 11px; color: #aaa; text-align: center; margin-top: 8px; line-height: 1.7; }
    .login-error { background: #fdf0ef; border: 1px solid #f5c6c2; color: #c0392b; border-radius: 9px;
      padding: 12px 15px; font-size: 12.5px; margin-top: 16px; display: none; white-space: pre-wrap; word-break: break-word; line-height: 1.8; }

    /* ============ メイン ============ */
    #mainScreen { display: none; }
    #mainScreen.show { display: block; }
    .topbar { background: #7B4F6E; color: #fff; padding: 0 20px; height: 56px; display: flex;
      align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .topbar h1 { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-badge { background: rgba(255,255,255,.18); border-radius: 12px; padding: 4px 12px; font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .btn-logout { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4); color: #fff;
      border-radius: 6px; padding: 6px 13px; font-size: 12px; cursor: pointer; font-family: inherit;
      white-space: nowrap; flex-shrink: 0; }

    .main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }
    .card { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(123,79,110,0.07); }
    .note { font-size: 13px; color: #888; line-height: 1.8; }
    .err-banner { background: #fdf0ef; border: 1px solid #f5c6c2; color: #c0392b; border-radius: 9px;
      padding: 12px 16px; font-size: 13px; margin-bottom: 14px; display: none; white-space: pre-wrap; }

    /* バー */
    .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .bar label { font-size: 13px; font-weight: bold; color: #555; white-space: nowrap; }
    select, .txt { padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; }
    select { min-width: 260px; cursor: pointer; }
    .txt { width: 150px; letter-spacing: .1em; }
    .btn { border: none; border-radius: 8px; padding: 10px 18px; font-size: 13px; font-weight: bold; cursor: pointer; font-family: inherit; }
    .btn-primary { background: #7B4F6E; color: #fff; }
    .btn-light { background: #f0eaee; color: #7B4F6E; }
    .ml-auto { margin-left: auto; }
    .filter-wrap { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filter-wrap .txt { width: 160px; }
    .filter-wrap select { min-width: 150px; }
    .filter-count { font-size: 13px; color: #7B4F6E; font-weight: bold; white-space: nowrap; }

    /* サマリー */
    .sum-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .sum-card { background: #fff; border-radius: 12px; padding: 14px 20px; min-width: 128px; box-shadow: 0 2px 12px rgba(123,79,110,0.07); }
    .sum-card .lbl { font-size: 12px; color: #999; }
    .sum-card .val { font-size: 26px; font-weight: bold; color: #7B4F6E; line-height: 1.3; }
    .sum-card .sub { font-size: 11px; color: #aaa; }

    /* 一覧 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .app-card { background: #fff; border: 1.5px solid #eee; border-radius: 12px; overflow: hidden; cursor: pointer; transition: .15s; }
    .app-card:hover { border-color: #7B4F6E; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(123,79,110,.13); }
    .app-head { background: linear-gradient(135deg, #7B4F6E, #9d6a8c); color: #fff; padding: 13px 16px; }
    .app-no { font-size: 11px; opacity: .8; }
    .app-name { font-size: 16px; font-weight: bold; }
    .app-kana { font-size: 11px; opacity: .85; }
    .app-body { padding: 12px 16px; }
    .app-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed #f0eaee; }
    .app-row .k { color: #999; }
    .app-row .v { font-weight: bold; color: #444; text-align: right; word-break: break-all; }
    .app-foot { padding: 10px 16px; background: #fafafa; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: #999; }
    .chip { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: bold; white-space: nowrap; }
    .thumbs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; }
    .thumb-file { width: 44px; height: 44px; border-radius: 6px; background: #f2eef1; display: flex; align-items: center; justify-content: center; font-size: 18px; }

    .empty { text-align: center; padding: 50px 20px; color: #aaa; }
    .empty .icon { font-size: 46px; margin-bottom: 10px; }

    /* モーダル */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
    .overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 860px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-head { background: #7B4F6E; color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .modal-head .nm { font-size: 17px; font-weight: bold; }
    .modal-head .kn { font-size: 12px; opacity: .85; }
    .modal-close { background: rgba(255,255,255,.18); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 17px; cursor: pointer; }
    .modal-body { padding: 18px 20px 28px; overflow-y: auto; }
    .sec-title { font-size: 14px; font-weight: bold; color: #7B4F6E; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #f0e6ec; }
    .sec-title:first-child { margin-top: 0; }
    .ans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .ans-item { background: #faf7f9; border-radius: 8px; padding: 9px 12px; }
    .ans-lbl { font-size: 11px; color: #9b8592; margin-bottom: 3px; }
    .ans-val { font-size: 13.5px; color: #333; word-break: break-word; white-space: pre-wrap; }
    .ans-long { background: #faf7f9; border-radius: 8px; padding: 11px 14px; margin-bottom: 10px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .gal-item { border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: #fafafa; }
    .gal-item img { width: 100%; height: 150px; object-fit: cover; display: block; cursor: pointer; }
    .gal-cap { padding: 7px 9px; font-size: 11px; color: #777; word-break: break-all; }
    .gal-file { display: flex; align-items: center; gap: 8px; padding: 12px; font-size: 13px; }
    table.m { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.m th { background: #f5eaf2; color: #7B4F6E; padding: 8px 10px; white-space: nowrap; border-bottom: 2px solid #e0c8d8; }
    .info { background: #eef4fb; border: 1px solid #c5d9ef; color: #14538a; border-radius: 9px; padding: 12px 15px; font-size: 13px; line-height: 1.8; }
    .warn { background: #fff8e6; border: 1px solid #ffcc80; color: #8a5a00; border-radius: 9px; padding: 12px 15px; font-size: 13px; line-height: 1.8; }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 900; padding: 20px; }
    #lightbox.show { display: flex; }
    #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

    @media (max-width: 560px) {
      .topbar { padding: 0 12px; gap: 8px; }
      .topbar h1 { font-size: 14px; }
      .topbar .h1-long { display: none; }
      .user-badge { max-width: 34vw; font-size: 11px; padding: 4px 9px; }
      .btn-logout { padding: 6px 10px; font-size: 11px; }
      .main { padding: 14px 12px 50px; }
      .card { padding: 14px 16px; }
      .sum-row { gap: 8px; }
      .sum-card { flex: 1; min-width: 92px; padding: 12px 14px; }
      .sum-card .val { font-size: 22px; }
      .txt { flex: 1; width: auto; min-width: 110px; }
      .filter-wrap .txt { width: auto; flex: 1 1 130px; }
      .filter-wrap select { min-width: 0; flex: 1 1 130px; }
      .modal-body { padding: 16px 14px 24px; }
      .login-head { padding: 30px 22px 26px; }
      .login-body { padding: 24px 22px 22px; }
      .login-title { font-size: 17px; }
      select { min-width: 0; width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .ans-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ============ ローディング ============ -->
<div id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">読み込んでいます...</div>
</div>

<!-- ============ ログイン ============ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-head">
      <div class="login-mark">💎</div>
      <div class="login-brand">DIANA</div>
      <div class="login-title">ゴールデンプロポーションアワード<br>応募状況確認</div>
      <div class="login-sub">サロン別の応募状況をご確認いただけます</div>
    </div>
    <div class="login-body">
      <button class="btn-chief" id="chiefBtn" onclick="startLogin('chief')"><span>👑</span> チーフとしてログイン</button>
      <div class="hint-box">
        <div><span class="k">ID</span>サロンコード（5桁）</div>
        <div><span class="k">パスワード</span>サロンAIチャットボットと同じパスワード</div>
      </div>
      <div class="login-error" id="loginError"></div>
      <div class="divider"><span>または</span></div>
      <button class="staff-toggle" onclick="toggleStaff()" id="staffToggleBtn">社員の方はこちら ▾</button>
      <div id="staffArea">
        <button class="btn-staff" onclick="startLogin('staff')"><span>🏢</span> 社員としてログイン</button>
        <div class="staff-note">
          DSHグループのMicrosoft 365アカウントでログインします。<br>
          ログイン後にサロンを指定してご確認ください。
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ メイン ============ -->
<div id="mainScreen">
  <div class="topbar">
    <div class="topbar-left">
      <span>💎</span>
      <h1><span class="h1-long">ゴールデンプロポーションアワード </span>応募状況</h1>
    </div>
    <div class="topbar-right">
      <span class="user-badge" id="userBadge">-</span>
      <button class="btn-logout" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <div class="main">
    <div class="err-banner" id="errBanner"></div>

    <!-- 社員：サロン指定 -->
    <div class="card" id="salonCard" style="display:none">
      <div class="bar">
        <label>🏢 サロンコード</label>
        <input type="text" class="txt" id="salonInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="00000">
        <button class="btn btn-primary" onclick="applySalon()">表示</button>
        <span class="note" id="salonNote">確認したいサロンコード（5桁）を入力してください。</span>
      </div>
    </div>

    <!-- コンテスト選択 -->
    <div class="card" id="contestCard" style="display:none">
      <div class="bar">
        <label>🏆 コンテスト</label>
        <select id="contestSelect" onchange="onContestChange()"></select>
        <button class="btn btn-light ml-auto" onclick="loadEntries()">🔄 更新</button>
      </div>
    </div>

    <!-- 絞り込み -->
    <div class="card" id="filterCard" style="display:none">
      <div class="filter-wrap">
        <label>🔍 絞り込み</label>
        <input type="text" class="txt" id="fName" placeholder="応募者氏名・かな" oninput="applyFilter()">
        <input type="text" class="txt" id="fDiana" placeholder="ダイアナコード" oninput="applyFilter()">
        <select id="fEntry" onchange="applyFilter()" style="display:none"></select>
        <select id="fDivision" onchange="applyFilter()" style="display:none"></select>
        <select id="fGender" onchange="applyFilter()" style="display:none"></select>
        <select id="fStatus" onchange="applyFilter()">
          <option value="">提出状況（すべて）</option>
          <option value="complete">✅ 両方提出済</option>
          <option value="member_only">👤 チーフ未提出</option>
          <option value="chief_only">👑 メンバー未提出</option>
          <option value="unkeyed">⚠️ 要確認</option>
        </select>
        <button class="btn btn-light" onclick="clearFilter()">クリア</button>
        <span class="filter-count" id="filterCount"></span>
      </div>
    </div>

    <div id="dataArea" style="display:none">
      <div class="sum-row">
        <div class="sum-card"><div class="lbl">応募者数</div><div class="val" id="cntTotal">0</div><div class="sub">名</div></div>
        <div class="sum-card"><div class="lbl">両方提出済</div><div class="val" id="cntComplete" style="color:#2e7d32">0</div><div class="sub">名</div></div>
        <div class="sum-card"><div class="lbl">未完了</div><div class="val" id="cntPending" style="color:#e65100">0</div><div class="sub" id="cntPendingSub">-</div></div>
      </div>
      <div class="grid" id="appGrid"></div>
    </div>

    <div id="emptyArea" style="display:none">
      <div class="card empty"><div class="icon">📭</div><p id="emptyMsg">応募はまだありません。</p></div>
    </div>
  </div>
</div>

<!-- 詳細モーダル -->
<div class="overlay" id="detailModal" onclick="onOverlayClick(event)">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="nm" id="mName">-</div>
        <div class="kn" id="mKana"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<div id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src="" alt=""></div>

<script>
// ============================================================
// ★ 設定
// ============================================================
const CHIEF_CLIENT_ID = '5503ac94-f3bf-42fa-8074-27557ca61ae1'; // DstyleSurvey-Chief-SPA
const CHIEF_TENANT_ID = 'ac36e29b-c866-49d3-9391-510bb3e88891'; // DIANA-SALON（外部ID）
const CIAM_DOMAIN     = 'DianasalonEntra';
const STAFF_CLIENT_ID = '1f4f2ade-4eeb-4f65-8fbd-394378a63518'; // dstyle-survey（既存）
const STAFF_TENANT_ID = '2648ac1f-8786-40fb-80f8-14bd84511449'; // DSHグループ

const REDIRECT_URI = window.location.origin + '/chief-contest.html';
const BASE_URL = location.hostname === 'localhost'
  ? 'http://localhost:7071'
  : 'https://func-dstyle-survey-gab2dwg3gdcqecgz.japaneast-01.azurewebsites.net';

// チーフ用の接続先（外部IDテナントのため ciamlogin.com に固定）
const CHIEF_AUTHORITY = 'https://' + CIAM_DOMAIN + '.ciamlogin.com/' + CHIEF_TENANT_ID;
const CHIEF_KNOWN_AUTHORITIES = [CIAM_DOMAIN + '.ciamlogin.com'];

const STATUS_META = {
  complete:    { label: '両方提出済',     icon: '✅', color: '#2e7d32', bg: '#eafaf0', bd: '#b7e4c7' },
  member_only: { label: 'チーフ未提出',   icon: '👤', color: '#e65100', bg: '#fff5e6', bd: '#ffcc80' },
  chief_only:  { label: 'メンバー未提出', icon: '👑', color: '#0d47a1', bg: '#e8f1fc', bd: '#a9c9f0' },
  unkeyed:     { label: '要確認',         icon: '⚠️', color: '#b71c1c', bg: '#fdeceb', bd: '#f5b7b1' },
  single:      { label: '提出済',         icon: '📄', color: '#555',    bg: '#f2f2f2', bd: '#ddd' }
};

// ============================================================
// 状態
// ============================================================
let msalInstance = null;
let apiToken = null;
let myRole = null;
let mySalon = null;
let myName = '';
let contests = [];
let entries = [];
let filtered = [];
let questionLabels = {};
let detailIndex = -1;

function savedMode() { return sessionStorage.getItem('loginMode'); }

function modeConfig(mode) {
  if (mode === 'staff') {
    return { clientId: STAFF_CLIENT_ID, authority: 'https://login.microsoftonline.com/' + STAFF_TENANT_ID,
             known: [], scopes: ['User.Read', 'GroupMember.Read.All'] };
  }
  return { clientId: CHIEF_CLIENT_ID, authority: CHIEF_AUTHORITY, known: CHIEF_KNOWN_AUTHORITIES,
           scopes: ['openid', 'profile', 'User.Read'] };
}

// ============================================================
// 初期化・認証
// ============================================================
async function init() {
  // 旧バージョンが残した接続先の記憶を掃除する
  localStorage.removeItem('chiefAuthIdxOk');
  sessionStorage.removeItem('chiefAuthIdx');

  const mode = savedMode();
  if (!mode) { showLogin(); return; }

  setLoadingText('ログイン状態を確認しています...');
  try {
    await buildInstance(mode);
    const result = await msalInstance.handleRedirectPromise();

    if (sessionStorage.getItem('postLogout')) {
      sessionStorage.removeItem('postLogout');
      sessionStorage.removeItem('loginMode');
      sessionStorage.removeItem('apiToken');
      clearMsalInteractionState();
      showLogin();
      return;
    }

    let account = result ? result.account : null;
    if (!account) {
      const accounts = msalInstance.getAllAccounts();
      if (accounts.length > 0) account = accounts[0];
    }
    if (!account) { showLogin(); return; }

    msalInstance.setActiveAccount(account);

    setLoadingText('権限を確認しています...');
    await ensureApiToken(mode);
    await startApp();
  } catch (e) {
    await handleAuthFailure(e, mode);
  }
}

async function buildInstance(mode) {
  const m = modeConfig(mode);
  msalInstance = new msal.PublicClientApplication({
    auth: { clientId: m.clientId, authority: m.authority, redirectUri: REDIRECT_URI, knownAuthorities: m.known },
    cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
  });
  await msalInstance.initialize();
}

async function startLogin(mode) {
  sessionStorage.setItem('loginMode', mode);
  sessionStorage.removeItem('apiToken');
  setLoadingText('ログイン画面に移動しています...');
  showLoading();
  try {
    await buildInstance(mode);
    await msalInstance.loginRedirect({ scopes: modeConfig(mode).scopes });
  } catch (e) {
    if (isInteractionInProgress(e)) {
      clearMsalInteractionState();
      try { await msalInstance.loginRedirect({ scopes: modeConfig(mode).scopes }); return; }
      catch (e2) { await handleAuthFailure(e2, mode); return; }
    }
    await handleAuthFailure(e, mode);
  }
}

// サーバー側でトークンを検証し、ロール付きAPIトークンを受け取る
async function ensureApiToken(mode, force) {
  if (!force) {
    const cached = sessionStorage.getItem('apiToken');
    if (cached) {
      const info = JSON.parse(cached);
      apiToken = info.token; myRole = info.role; mySalon = info.salonCode || null; myName = info.userName || '';
      return;
    }
  }
  const cfg = modeConfig(mode);
  const account = msalInstance.getActiveAccount();
  let tok;
  try {
    tok = await msalInstance.acquireTokenSilent({ scopes: cfg.scopes, account });
  } catch (e) {
    // Graphのスコープが取れない場合でも、IDトークンだけは取得できるようにする
    tok = await msalInstance.acquireTokenSilent({ scopes: ['openid', 'profile'], account });
  }
  const res = await fetch(BASE_URL + '/api/chiefauth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mode, idToken: tok.idToken, accessToken: tok.accessToken })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('認証に失敗しました（HTTP ' + res.status + '）'));

  apiToken = data.token; myRole = data.role; mySalon = data.salonCode || null; myName = data.userName || '';
  sessionStorage.setItem('apiToken', JSON.stringify({ token: apiToken, role: myRole, salonCode: mySalon, userName: myName }));
}

async function handleAuthFailure(e, mode) {
  sessionStorage.removeItem('loginMode');
  sessionStorage.removeItem('apiToken');
  clearMsalInteractionState();
  showLogin();
  showLoginError('ログインできませんでした。\n' + (e && e.message ? e.message : String(e)));
}
function isInteractionInProgress(e) {
  const msg = ((e && (e.errorCode || '')) + ' ' + (e && e.message ? e.message : String(e))).toLowerCase();
  return msg.indexOf('interaction_in_progress') >= 0;
}
function clearMsalInteractionState() {
  [sessionStorage, localStorage].forEach(function(store) {
    try {
      const keys = [];
      for (let i = 0; i < store.length; i++) {
        const k = store.key(i);
        if (k && k.indexOf('msal') >= 0 && k.indexOf('interaction.status') >= 0) keys.push(k);
      }
      keys.forEach(function(k) { store.removeItem(k); });
    } catch (e) {}
  });
}

async function doLogout() {
  sessionStorage.setItem('postLogout', '1');
  sessionStorage.removeItem('apiToken');
  sessionStorage.removeItem('staffSalon');
  if (msalInstance) { try { await msalInstance.logoutRedirect(); return; } catch (e) {} }
  sessionStorage.removeItem('postLogout');
  sessionStorage.removeItem('loginMode');
  clearMsalInteractionState();
  location.reload();
}

// ============================================================
// API
// ============================================================
async function apiGet(path) {
  const res = await fetch(BASE_URL + path, { headers: { 'x-admin-token': apiToken || '' } });
  if (res.status === 401) {
    // トークン期限切れ → 再取得して1回だけ再試行
    await ensureApiToken(savedMode(), true);
    const retry = await fetch(BASE_URL + path, { headers: { 'x-admin-token': apiToken || '' } });
    if (!retry.ok) throw new Error((await retry.json().catch(() => ({}))).error || ('HTTP ' + retry.status));
    return retry.json();
  }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || ('HTTP ' + res.status));
  return res.json();
}

// 選択肢はデータから自動生成し、該当する設問が無ければ非表示にする
const FILTER_DEFS = [
  { id: 'fEntry',    keywords: ['応募区分'],          label: '応募区分' },
  { id: 'fDivision', keywords: ['出場区分', '部門'],  label: '出場区分' },
  { id: 'fGender',   keywords: ['性別'],              label: '性別' }
];

function buildFilters() {
  document.getElementById('filterCard').style.display = entries.length > 0 ? 'block' : 'none';

  // 該当する応募が無い提出状況は選択肢から外す
  const statusSel = document.getElementById('fStatus');
  const present = {};
  entries.forEach(function(e) { present[e.status] = true; });
  Array.prototype.forEach.call(statusSel.options, function(opt) {
    if (!opt.value) return;
    opt.hidden = !present[opt.value];
  });
  if (statusSel.value && !present[statusSel.value]) statusSel.value = '';

  FILTER_DEFS.forEach(function(def) {
    const sel = document.getElementById(def.id);
    const values = [];
    entries.forEach(function(e) {
      const v = answerByKeywords(e, def.keywords);
      if (v && values.indexOf(v) < 0) values.push(v);
    });
    if (values.length === 0) { sel.style.display = 'none'; sel.innerHTML = ''; return; }
    values.sort();
    sel.style.display = '';
    sel.innerHTML = '<option value="">' + esc(def.label) + '（すべて）</option>'
      + values.map(function(v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('');
  });
}

function applyFilter() {
  const name  = (document.getElementById('fName').value || '').trim().toLowerCase();
  const diana = (document.getElementById('fDiana').value || '').trim().toLowerCase();
  const status = document.getElementById('fStatus').value;

  filtered = entries.filter(function(e) {
    if (name) {
      const hay  = ((nameOf(e) || '') + ' ' + (e.nameKanji || '')).toLowerCase();
      const kana = normalizeKana((kanaOf(e) || '') + (e.nameKana || ''));
      const q    = normalizeKana(name);
      if (hay.indexOf(name) < 0 && !(q && kana.indexOf(q) >= 0)) return false;
    }
    if (diana) {
      const code = ((e.memberCode || '') + ' ' + answerByKeywords(e, ['ダイアナコード'])).toLowerCase();
      if (code.indexOf(diana) < 0) return false;
    }
    if (status && e.status !== status) return false;
    for (const def of FILTER_DEFS) {
      const sel = document.getElementById(def.id);
      if (!sel || sel.style.display === 'none' || !sel.value) continue;
      if (answerByKeywords(e, def.keywords) !== sel.value) return false;
    }
    return true;
  });

  const cnt = document.getElementById('filterCount');
  cnt.textContent = (filtered.length === entries.length)
    ? entries.length + '件'
    : filtered.length + '件 / 全' + entries.length + '件';

  renderList();
}

function clearFilter() {
  document.getElementById('fName').value = '';
  document.getElementById('fDiana').value = '';
  document.getElementById('fStatus').value = '';
  FILTER_DEFS.forEach(function(def) { document.getElementById(def.id).value = ''; });
  applyFilter();
}

function renderDetail() {
  const e = filtered[detailIndex];

  const fileQids = {};
  (e.files || []).forEach(function(f) { fileQids[f.qid] = true; });

  // 回答内容（添付ファイルの設問は除外）
  const shortKeys = ['出場区分', '氏名', 'ふりがな', 'ダイアナコード', '生年月日', 'サロンコード', '都道府県', 'サロン名', 'チーフ名', 'サロン所在地'];
  // 両フォームの全設問を並べる（未提出側は空欄で表示）
  // questionLabels にはメンバー用・チーフ用の全設問が含まれる
  const qids = Object.keys(questionLabels).length > 0
    ? Object.keys(questionLabels)
    : Object.keys(e.answers || {});
  const list = qids
    .filter(function(k) { return !fileQids[k]; })
    .map(function(k) {
      const v = (e.answers || {})[k];
      return { label: questionLabels[k] || k, value: (typeof v === 'object' && v !== null) ? JSON.stringify(v) : String(v == null ? '' : v) };
    });

  // メンバー用とチーフ用で同じ設問がある場合、値が一致していればチーフ側を隠す
  const deduped = dedupeChiefAnswers(list);
  const shorts = deduped.filter(function(a) { return shortKeys.some(function(k) { return a.label.indexOf(k) >= 0; }); });
  const longs  = deduped.filter(function(a) { return !shortKeys.some(function(k) { return a.label.indexOf(k) >= 0; }); });

  const imgs = (e.files || []).filter(function(f) { return f.kind === 'image'; });
  const others = (e.files || []).filter(function(f) { return f.kind !== 'image'; });

  let html = '';

  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">'
        + '<span class="chip" style="background:' + meta.bg + ';border:1px solid ' + meta.bd + ';color:' + meta.color + '">' + meta.icon + ' ' + meta.label + '</span>'
        + '</div>';
  html += '<div class="note">メンバー提出：' + esc(fmtDateTime(e.memberAt) || '未提出')
        + '　／　チーフ提出：' + esc(fmtDateTime(e.chiefAt) || '未提出') + '</div>';

  // 会員データベースから取得した情報
  if (e.nameKanji || e.nameKana || e.salonCode) {
    html += '<div class="sec-title">👤 会員情報</div>'
          + '<div class="ans-grid">'
          + dbItem('氏名', e.nameKanji)
          + dbItem('氏名カナ', e.nameKana)
          + dbItem('サロンコード', e.salonCode)
          + dbItem('ダイアナコード', e.memberCode)
          + '</div>';
  }

  html += '<div class="sec-title">📝 応募内容</div>';
  if (shorts.length > 0) {
    html += '<div class="ans-grid">' + shorts.map(function(a) {
      return '<div class="ans-item"' + (a.mismatch ? ' style="border:1.5px solid #ffcc80;background:#fff8e6;"' : '') + '>'
           + '<div class="ans-lbl">' + esc(a.label) + (a.mismatch ? ' <span style="color:#e65100;">⚠️ 相違</span>' : '') + '</div>'
           + '<div class="ans-val">' + (a.value ? esc(a.value) : '<span style="color:#c8c8c8">未入力</span>') + '</div></div>';
    }).join('') + '</div>';
  }
  if (longs.length > 0) {
    html += '<div style="margin-top:10px">' + longs.map(function(a) {
      return '<div class="ans-long"' + (a.mismatch ? ' style="border:1.5px solid #ffcc80;background:#fff8e6;"' : '') + '>'
           + '<div class="ans-lbl">' + esc(a.label) + (a.mismatch ? ' <span style="color:#e65100;">⚠️ メンバー回答と相違</span>' : '') + '</div>'
           + '<div class="ans-val">' + (a.value ? esc(a.value) : '<span style="color:#c8c8c8">未入力</span>') + '</div></div>';
    }).join('') + '</div>';
  }
  if (shorts.length === 0 && longs.length === 0) html += '<div class="note">回答内容がありません。</div>';

  if (imgs.length > 0 || others.length > 0) {
    html += '<div class="sec-title">📷 応募写真・添付ファイル</div>';
    if (imgs.length > 0) {
      html += '<div class="gallery">' + imgs.map(function(f) {
        return '<div class="gal-item">'
             + '<img src="' + esc(f.url) + '" alt="" loading="lazy" onclick="openLightbox(\'' + esc(f.url) + '\')">'
             + '<div class="gal-cap">' + esc(f.label) + '</div></div>';
      }).join('') + '</div>';
    }
    if (others.length > 0) {
      html += '<div style="margin-top:10px">' + others.map(function(f) {
        return '<div class="gal-item gal-file">' + kindIcon(f.kind)
             + '<span style="flex:1">' + esc(f.label) + '<br><span style="font-size:11px;color:#999">' + esc(f.fileName) + '</span></span>'
             + '<a href="' + esc(f.url) + '" target="_blank" rel="noopener" class="btn btn-light" style="text-decoration:none">開く</a></div>';
      }).join('') + '</div>';
    }
  }

  document.getElementById('mBody').innerHTML = html;
}

// ============================================================
// メンバー用・チーフ用の重複回答をまとめる
// ============================================================
// ラベルから【チーフ】や「応募者」などを取り除いて比較用のキーにする
function baseLabel(label) {
  return String(label || '')
    .replace(/^【チーフ】/, '')
    .replace(/^(応募者|メンバーの|メンバー)\s*/, '')
    .replace(/[\s　]/g, '');
}

function normalizeValue(v) {
  return String(v == null ? '' : v)
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/[\s　]/g, '')
    .trim()
    .toUpperCase();
}

// 値が一致していればチーフ側を隠し、食い違う場合は両方残して目印を付ける
function dedupeChiefAnswers(list) {
  const memberByBase = {};
  list.forEach(function(a) {
    if (a.label.indexOf('【チーフ】') === 0) return;
    const b = baseLabel(a.label);
    if (b && memberByBase[b] === undefined) memberByBase[b] = a.value;
  });

  return list.filter(function(a) {
    if (a.label.indexOf('【チーフ】') !== 0) return true;
    const b = baseLabel(a.label);
    if (!(b in memberByBase)) return true;   // メンバー側に無い設問は残す
    const cv = normalizeValue(a.value);
    if (!cv) return false;                   // チーフ側が未入力なら隠す（メンバー側に同じ項目がある）
    return normalizeValue(memberByBase[b]) !== cv;
  }).map(function(a) {
    // 値が食い違って残った項目にだけ目印を付ける（どちらかが空欄の場合は付けない）
    if (a.label.indexOf('【チーフ】') === 0) {
      const b = baseLabel(a.label);
      if ((b in memberByBase) && normalizeValue(memberByBase[b]) && normalizeValue(a.value)) {
        return { label: a.label, value: a.value, mismatch: true };
      }
    }
    return a;
  });
}

// 会員情報の1項目を描画する
function dbItem(label, value) {
  return '<div class="ans-item"><div class="ans-lbl">' + esc(label) + '</div>'
       + '<div class="ans-val">' + (value ? esc(value) : '<span style="color:#c8c8c8">-</span>') + '</div></div>';
}

// ============================================================
// ヘルパー
// ============================================================
function answerByKeywords(e, keywords) {
  const answers = e.answers || {};
  for (const kw of keywords) {
    for (const k of Object.keys(answers)) {
      const label = questionLabels[k] || k;
      if (label.indexOf(kw) >= 0) {
        const v = answers[k];
        const s = (typeof v === 'object' && v !== null) ? (v.value || '') : String(v == null ? '' : v);
        if (s) return s;
      }
    }
  }
  return '';
}
// 氏名：回答を優先し、無ければDB（customer_master）の値を使う
function nameOf(e) {
  const fromAnswer = answerByKeywords(e, ['応募者氏名', '氏名', 'お名前', '名前']);
  if (fromAnswer) return fromAnswer;
  return (e.nameKanji || '').trim();
}
// 検索用のかな正規化
// ひらがな→カタカナに揃え、全角/半角カナ・空白の違いを吸収する
// （DBの氏名カナはカタカナのため、ひらがなで入力してもヒットするようにする）
function normalizeKana(str) {
  if (!str) return '';
  let s = String(str);
  // 半角カナ → 全角カナ
  const HALF = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
  const FULL = 'ヲァィゥェォャュョッーアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン';
  s = s.replace(/[ｦ-ﾝ]/g, c => FULL.charAt(HALF.indexOf(c)) || c)
       .replace(/ﾞ/g, '゛').replace(/ﾟ/g, '゜');
  // 濁点・半濁点の結合
  const DAKUTEN = { 'カ':'ガ','キ':'ギ','ク':'グ','ケ':'ゲ','コ':'ゴ','サ':'ザ','シ':'ジ','ス':'ズ','セ':'ゼ','ソ':'ゾ',
                    'タ':'ダ','チ':'ヂ','ツ':'ヅ','テ':'デ','ト':'ド','ハ':'バ','ヒ':'ビ','フ':'ブ','ヘ':'ベ','ホ':'ボ','ウ':'ヴ' };
  const HANDAKU = { 'ハ':'パ','ヒ':'ピ','フ':'プ','ヘ':'ペ','ホ':'ポ' };
  s = s.replace(/(.)[゛]/g, (m, c) => DAKUTEN[c] || m)
       .replace(/(.)[゜]/g, (m, c) => HANDAKU[c] || m);
  // ひらがな → カタカナ
  s = s.replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
  // 空白を除去
  return s.replace(/[\s\u3000]/g, '');
}

// 氏名カナ：回答を優先し、無ければDB（customer_master）の値を使う
function kanaOf(e) {
  const fromAnswer = answerByKeywords(e, ['ふりがな', 'フリガナ', 'カナ']);
  if (fromAnswer) return fromAnswer;
  return (e.nameKana || '').trim();
}

function kindIcon(kind) {
  return kind === 'pdf' ? '📕' : kind === 'excel' ? '📊' : kind === 'word' ? '📄' : kind === 'image' ? '🖼️' : '📎';
}
function fmtDate(v) {
  if (!v) return '';
  const m = String(v).match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) return m[1] + '/' + ('0' + m[2]).slice(-2) + '/' + ('0' + m[3]).slice(-2);
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleDateString('ja-JP');
}
function fmtDateTime(v) {
  if (!v) return '';
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function closeModal() { document.getElementById('detailModal').classList.remove('show'); detailIndex = -1; }
function onOverlayClick(ev) { if (ev.target === document.getElementById('detailModal')) closeModal(); }
function openLightbox(url) { document.getElementById('lightboxImg').src = url; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
document.addEventListener('keydown', function(ev) {
  if (ev.key !== 'Escape') return;
  if (document.getElementById('lightbox').classList.contains('show')) closeLightbox();
  else closeModal();
});

function toggleStaff() {
  const area = document.getElementById('staffArea');
  const btn = document.getElementById('staffToggleBtn');
  btn.textContent = area.classList.toggle('show') ? '社員の方はこちら ▴' : '社員の方はこちら ▾';
}
function showLoading()     { document.getElementById('loadingScreen').style.display = 'flex'; }
function setLoadingText(t) { document.getElementById('loadingText').textContent = t; }
function showLogin() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('mainScreen').classList.remove('show');
  document.getElementById('loginScreen').classList.add('show');
}
function showLoginError(m) { const el = document.getElementById('loginError'); el.textContent = m; el.style.display = 'block'; }
function showError(m) {
  const el = document.getElementById('errBanner');
  el.textContent = m;
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 10000);
}
function showEmpty(msg) {
  document.getElementById('dataArea').style.display = 'none';
  const a = document.getElementById('emptyArea');
  a.style.display = 'block';
  document.getElementById('emptyMsg').textContent = msg;
}

init();
</script>
