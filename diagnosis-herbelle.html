<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>よもぎ蒸し体質診断</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f5f7f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .diag-wrap { width: 100%; max-width: 560px; }


        /* ヘッダー */
        .diag-header { background: #4A5D4E; color: white; border-radius: 16px 16px 0 0; padding: 24px 28px 24px; text-align: center; }
        .diag-logo-card { display: inline-block; background: #fff; border-radius: 40px; padding: 10px 26px; margin-bottom: 14px; box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
        .diag-logo-card img { height: 30px; width: auto; display: block; }
        .diag-header h1 { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        .diag-header p { font-size: 14px; opacity: 0.85; line-height: 1.6; }

        /* 進捗バー */
        .progress-wrap { background: #3a4d3e; padding: 12px 28px; }
        .progress-bar-outer { background: rgba(255,255,255,0.2); border-radius: 20px; height: 8px; }
        .progress-bar-inner { background: white; border-radius: 20px; height: 8px; transition: width 0.4s ease; }
        .progress-text { color: rgba(255,255,255,0.8); font-size: 12px; text-align: right; margin-top: 4px; }

        /* コンテンツ */
        .diag-body { background: white; border-radius: 0 0 16px 16px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .diag-body.is-result { padding: 16px; background: #eef0ee; }

        /* 質問 */
        .question-text { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 20px; line-height: 1.5; }
        .choices { display: flex; flex-direction: column; gap: 10px; }
        .choice-btn { padding: 16px 20px; border: 2px solid #e0e0e0; border-radius: 10px; background: white; font-size: 15px; color: #333; cursor: pointer; text-align: left; transition: all 0.2s; }
        .choice-btn:hover { border-color: #4A5D4E; background: #f0f4f0; color: #4A5D4E; transform: translateY(-1px); }
        .choice-btn.selected { border-color: #4A5D4E; background: #4A5D4E; color: white; }

        /* 結果画面 */
        .result-screen { display: none; text-align: center; }

        /* 診断結果レポート風デザイン */
        .result-report { position: relative; background: #ffffff; border: 1px solid #e2e5e2; border-radius: 8px; padding: 0; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.09); }

        /* 文書ヘッダー（白基調・ビジネス文書風） */
        .result-report-top { background: #ffffff; padding: 34px 32px 24px; border-bottom: 3px solid #4A5D4E; }
        .result-doc-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .result-eyebrow { font-size: 10px; letter-spacing: 3px; color: #4A5D4E; font-weight: bold; text-transform: uppercase; }
        .result-doc-no { font-size: 10px; color: #aaa; letter-spacing: 0.5px; }
        .result-to-line { font-size: 12px; color: #888; margin-bottom: 6px; letter-spacing: 0.5px; }
        .result-title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .result-badge { display: inline-block; background: #4A5D4E; color: #fff; padding: 4px 12px; border-radius: 3px; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
        .result-title { font-family: 'Hiragino Mincho ProN', 'Georgia', serif; font-size: 23px; font-weight: bold; color: #1f2a23; letter-spacing: 0.5px; }

        .result-report-body { padding: 30px 32px 30px; text-align: left; }
        .result-image { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; margin-bottom: 24px; border: 1px solid #e2e5e2; }

        /* エグゼクティブサマリー */
        .result-summary { background: #f7f8f6; border: 1px solid #e2e5e2; border-left: 3px solid #4A5D4E; border-radius: 0 6px 6px 0; padding: 16px 20px; margin-bottom: 28px; }
        .result-summary-label { font-size: 10px; color: #4A5D4E; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
        .result-summary-text { font-size: 13px; color: #3a4038; line-height: 1.8; }

        /* セクション共通（現状診断・提案） */
        .result-doc-section { margin-bottom: 28px; }
        .result-doc-section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eef1ee; }
        .result-doc-section-num { width: 22px; height: 22px; border-radius: 50%; background: #4A5D4E; color: #fff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .result-doc-section-title { font-size: 13px; font-weight: bold; color: #4A5D4E; letter-spacing: 1px; }
        .result-doc-section-sub { font-size: 9px; color: #aab3a8; letter-spacing: 1px; margin-left: auto; text-transform: uppercase; }
        .result-doc-section-body { font-size: 14px; color: #3a4038; line-height: 2; padding-left: 32px; margin-left: 10px; }

        .result-course { position: relative; background: #f7f8f6; border: 1px solid #e2e5e2; border-radius: 6px; padding: 14px 16px 12px 18px; margin-top: 12px; }
        .result-course::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #4A5D4E; border-radius: 3px 0 0 3px; }
        .result-course .label { font-size: 10px; color: #8aa28e; font-weight: bold; letter-spacing: 1px; margin-bottom: 3px; text-transform: uppercase; }
        .result-course .value { font-family: 'Hiragino Mincho ProN', 'Georgia', serif; font-size: 16px; font-weight: bold; color: #1f2a23; }

        .result-report-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; padding-top: 16px; border-top: 1px solid #eef1ee; }
        .result-report-brand { font-size: 11px; color: #888; letter-spacing: 0.5px; }
        .result-report-date { font-size: 10px; color: #aaa; }

        .result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-pdf { display: block; padding: 13px; background: #fff; color: #4A5D4E; border: 1.5px solid #4A5D4E; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; }
        .btn-pdf:hover { background: #f7f8f6; }

        /* 印刷用スタイル */
        @media print {
            body { background: #fff !important; padding: 0 !important; }
            .diag-header, .progress-wrap, .result-actions { display: none !important; }
            .diag-wrap { max-width: 100% !important; }
            .diag-body { box-shadow: none !important; padding: 0 !important; background: #fff !important; }
            .result-report { box-shadow: none !important; border: none !important; }
        }
        .btn-booking { display: block; padding: 16px; background: #4A5D4E; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; transition: background 0.2s; }
        .btn-booking:hover { background: #3a4d3e; }
        .btn-retry { display: block; padding: 14px; background: white; color: #4A5D4E; border: 2px solid #4A5D4E; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; }
        .btn-retry:hover { background: #f0f4f0; }

        /* エラー */
        .error-screen { display: none; text-align: center; padding: 40px 0; }
        .error-screen .icon { font-size: 48px; margin-bottom: 16px; }
        .error-screen p { color: #888; font-size: 14px; }

        /* ローディング */
        .loading-screen { text-align: center; padding: 40px 0; color: #888; }

        /* レスポンシブ対応（iPad基本・PC対応） */
        @media (min-width: 768px) {
            .diag-wrap { max-width: 680px; }
            .diag-header h1 { font-size: 26px; }
            .diag-header p { font-size: 15px; }
            .diag-body { padding: 36px; }
            .question-text { font-size: 20px; }
            .choice-btn { font-size: 17px; padding: 18px 22px; }
        }
        @media (min-width: 1200px) {
            .diag-wrap { max-width: 760px; }
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .diag-header { padding: 18px 16px 18px; }
            .diag-header h1 { font-size: 19px; }
            .diag-body { padding: 20px 16px; }
            .diag-logo-card { padding: 8px 20px; }
            .diag-logo-card img { height: 24px; }
            .result-report-top { padding: 24px 18px 18px; }
            .result-report-body { padding: 22px 18px 22px; }
            .result-doc-section-body { padding-left: 12px; margin-left: 6px; }
        }
    </style>
</head>

            if (diagData.active === false) {
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('closedScreen').style.display = 'block';
                return;
            }
            startDiagnosis();
        } catch(e) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('errorScreen').style.display = 'block';
            document.getElementById('errorMsg').textContent = e.message;
        }
    }

    // ============================================================
    // 診断開始
    // ============================================================
    function startDiagnosis() {
        currentQIndex = 0;
        scores = {};
        answeredChoices = [];
        Object.keys(diagData.results || {}).forEach(function(k) { scores[k] = 0; });
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('errorScreen').style.display = 'none';
        document.getElementById('progressWrap').style.display = 'block';
        document.querySelector('.diag-body').classList.remove('is-result');
        showQuestion();
    }

    function printResult() {
        window.print();
    }

    // ============================================================
    // 質問表示
    // ============================================================
    function showQuestion() {
        var q = diagData.questions[currentQIndex];
        var total = diagData.questions.length;

        // 進捗バー
        var pct = Math.round((currentQIndex / total) * 100);
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressText').textContent = (currentQIndex + 1) + ' / ' + total;

        // 質問文
        document.getElementById('questionText').textContent = q.text;

        // 選択肢
        var choiceList = document.getElementById('choiceList');
        choiceList.innerHTML = (q.choices || []).map(function(c, i) {
            return '<button class="choice-btn" onclick="selectChoice(' + i + ')">' + escHtml(c.label) + '</button>';
        }).join('');

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('questionScreen').style.display = 'block';
    }

    // ============================================================
    // 選択肢を選ぶ
    // ============================================================
    function selectChoice(choiceIdx) {
        // ハイライト
        document.querySelectorAll('.choice-btn').forEach(function(b, i) {
            b.classList.toggle('selected', i === choiceIdx);
        });

        // スコア加算
        var q = diagData.questions[currentQIndex];
        var choice = q.choices[choiceIdx];
        Object.keys(choice.scores || {}).forEach(function(k) {
            scores[k] = (scores[k] || 0) + (choice.scores[k] || 0);
        });

        // 回答内容を記録（AI提案用）
        answeredChoices.push({ question: q.text || '', answer: choice.label || '' });

        // 次へ（少し遅延してから）
        setTimeout(function() {
            currentQIndex++;
            if (currentQIndex < diagData.questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }, 350);
    }

    // ============================================================
    // 結果表示
    // ============================================================
    function showResult() {
        // 最高スコアのパターンを取得
        var maxKey = Object.keys(scores).reduce(function(a, b) {
            return (scores[a] || 0) >= (scores[b] || 0) ? a : b;
        });
        var result = diagData.results[maxKey];
        if (!result) { showError('結果データが見つかりません'); return; }

        // 進捗バー100%
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('progressText').textContent = '診断完了！';

        // 結果画面
        document.getElementById('questionScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        document.querySelector('.diag-body').classList.add('is-result');
        document.getElementById('resultTitle').textContent = result.title || '';

        // 現状診断セクション：タイプ名を簡潔な説明文として表示
        document.getElementById('resultAssessment').textContent =
            result.title ? ('診断の結果、あなたは「' + result.title + '」の傾向が見られます。') : '';

        // エグゼクティブサマリー：タイプ名とおすすめコースを一言でまとめる
        var summaryParts = [];
        if (result.title) summaryParts.push('体質タイプは「' + result.title + '」');
        if (result.course) summaryParts.push('おすすめは「' + result.course + '」');
        document.getElementById('resultSummary').textContent =
            summaryParts.length ? (summaryParts.join('、') + 'です。詳細は本書1.現状診断・2.ご提案をご確認ください。') : '';

        // 文書番号・日付
        var today = new Date();
        var dateStr = today.getFullYear() + '.' + String(today.getMonth()+1).padStart(2,'0') + '.' + String(today.getDate()).padStart(2,'0');
        document.getElementById('resultDate').textContent = dateStr;
        document.getElementById('resultDocNo').textContent = 'No. ' + dateStr.replace(/\./g, '') + '-' + Math.floor(Math.random()*900+100);
        if (diagData.title) {
            document.getElementById('resultBrand').textContent = diagData.title;
        }

        // 画像
        if (result.imageBase64) {
            document.getElementById('resultImage').src = result.imageBase64;
            document.getElementById('resultImage').style.display = 'block';
        } else {
            document.getElementById('resultImage').style.display = 'none';
        }

        // コース
        if (result.course) {
            document.getElementById('resultCourse').textContent = result.course;
            document.getElementById('resultCourseWrap').style.display = 'block';
        } else {
            document.getElementById('resultCourseWrap').style.display = 'none';
        }

        // 説明文（提案セクション）
        document.getElementById('resultDescription').textContent = result.description || '';

        // 予約ボタン
        if (result.bookingUrl) {
            var btn = document.getElementById('bookingBtn');
            btn.href = result.bookingUrl;
            btn.style.display = 'block';
        } else {
            document.getElementById('bookingBtn').style.display = 'none';
        }

        // ログ送信（回答内容を含めてAI提案を取得）
        document.getElementById('aiCommentWrap').style.display = 'none';
        fetch(BASE_URL + '/api/diagnosislog', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tenant: TENANT, resultKey: maxKey, resultTitle: result.title, diagTitle: diagData.title || '', diagId: diagData.diagId || diagData.id || '', answers: answeredChoices })
        }).then(function(res) { return res.ok ? res.json() : null; })
          .then(function(data) { renderAiComment(data && data.aiSuggestion); })
          .catch(function() {});
    }

    var ADVISOR_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="72" height="72"><circle cx="100" cy="100" r="96" fill="#eef3ee"/><circle cx="100" cy="100" r="96" fill="none" stroke="#8aa28e" stroke-width="2"/><g transform="translate(30,38) rotate(-30)"><ellipse cx="0" cy="0" rx="10" ry="4.5" fill="#8aa28e" opacity="0.85"/><line x1="-9" y1="0" x2="9" y2="0" stroke="#5d7561" stroke-width="0.8"/></g><g transform="translate(22,55) rotate(-60)"><ellipse cx="0" cy="0" rx="8" ry="3.6" fill="#a8bfa9" opacity="0.85"/><line x1="-7" y1="0" x2="7" y2="0" stroke="#5d7561" stroke-width="0.7"/></g><g transform="translate(172,150) rotate(35)"><ellipse cx="0" cy="0" rx="10" ry="4.5" fill="#8aa28e" opacity="0.85"/><line x1="-9" y1="0" x2="9" y2="0" stroke="#5d7561" stroke-width="0.8"/></g><path d="M 52 200 L 52 168 Q 52 138 78 132 L 122 132 Q 148 138 148 168 L 148 200 Z" fill="#4A5D4E"/><path d="M 88 132 L 100 152 L 112 132 Q 106 128 100 128 Q 94 128 88 132 Z" fill="#fdfcf8"/><rect x="92" y="112" width="16" height="20" rx="7" fill="#f3d3bd"/><ellipse cx="100" cy="88" rx="30" ry="33" fill="#f8dcc8"/><path d="M 68 88 Q 66 48 100 46 Q 134 48 132 88 Q 133 74 126 66 Q 122 58 112 56 Q 118 64 116 70 Q 108 56 92 58 Q 78 60 74 72 Q 70 78 68 88 Z" fill="#6b5544"/><circle cx="128" cy="54" r="11" fill="#6b5544"/><circle cx="128" cy="54" r="11" fill="none" stroke="#5a4636" stroke-width="1" opacity="0.5"/><path d="M 82 80 Q 87 77 92 79" fill="none" stroke="#5a4636" stroke-width="1.6" stroke-linecap="round"/><path d="M 108 79 Q 113 77 118 80" fill="none" stroke="#5a4636" stroke-width="1.6" stroke-linecap="round"/><path d="M 82 89 Q 87 93 92 89" fill="none" stroke="#4a3a2e" stroke-width="2" stroke-linecap="round"/><path d="M 108 89 Q 113 93 118 89" fill="none" stroke="#4a3a2e" stroke-width="2" stroke-linecap="round"/><ellipse cx="80" cy="97" rx="5" ry="3" fill="#f3b8a0" opacity="0.6"/><ellipse cx="120" cy="97" rx="5" ry="3" fill="#f3b8a0" opacity="0.6"/><path d="M 93 104 Q 100 110 107 104" fill="none" stroke="#c4715c" stroke-width="2" stroke-linecap="round"/><ellipse cx="69" cy="98" rx="2.5" ry="4" fill="#8aa28e"/><ellipse cx="131" cy="98" rx="2.5" ry="4" fill="#8aa28e"/><g transform="translate(100,160)"><ellipse cx="0" cy="0" rx="7" ry="3.2" fill="#a8bfa9" transform="rotate(-20)"/><ellipse cx="5" cy="3" rx="7" ry="3.2" fill="#8aa28e" transform="rotate(25)"/></g></svg>';

    function renderAiComment(suggestion) {
        var wrap = document.getElementById('aiCommentWrap');
        if (!suggestion) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
        var body = '';
        if (suggestion.format === 'structured' && suggestion.sections && typeof suggestion.sections === 'object') {
            body = Object.keys(suggestion.sections).map(function(label) {
                return '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:bold;color:#4A5D4E;margin-bottom:3px">' + escHtml(label) + '</div><div style="font-size:13px;color:#3a4038;line-height:1.8">' + escHtml(suggestion.sections[label]).replace(/\n/g, '<br>') + '</div></div>';
            }).join('');
        } else if (suggestion.text) {
            body = '<div style="font-size:13px;color:#3a4038;line-height:1.9">' + escHtml(suggestion.text).replace(/\n/g, '<br>') + '</div>';
        } else {
            wrap.style.display = 'none'; wrap.innerHTML = ''; return;
        }
        wrap.innerHTML =
            '<div class="result-doc-section" style="margin-bottom:0">' +
              '<div class="result-doc-section-head">' +
                '<div class="result-doc-section-num">✨</div>' +
                '<div class="result-doc-section-title">AIアドバイザーコメント</div>' +
                '<div class="result-doc-section-sub">AI Insight</div>' +
              '</div>' +
              '<div style="display:flex;gap:14px;align-items:flex-start;margin-top:4px">' +
                '<div style="flex-shrink:0">' + ADVISOR_SVG + '</div>' +
                '<div style="flex:1;position:relative;background:#f7f8f6;border:1px solid #e2e5e2;border-radius:10px;padding:14px 16px">' +
                  '<div style="position:absolute;left:-7px;top:24px;width:12px;height:12px;background:#f7f8f6;border-left:1px solid #e2e5e2;border-bottom:1px solid #e2e5e2;transform:rotate(45deg)"></div>' +
                  body +
                '</div>' +
              '</div>' +
            '</div>';
        wrap.style.display = 'block';
    }

    function showError(msg) {
        document.getElementById('questionScreen').style.display = 'none';
        document.getElementById('errorScreen').style.display = 'block';
        document.getElementById('errorMsg').textContent = msg;
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    init();
</script>
</body>
</html>
